name: Publish image

# Container Isolation for Autonomous Runs (specs/015-container-isolation).
# contracts/image-publishing.md §6. Tagging a v<semver> release is the only
# operator action (FR-008, SC-011): build -> secret scan -> smoke test ->
# push, gated by an immutability guard so a version tag is never overwritten
# (FR-009, SC-010).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. v1.2.3"
        required: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: rzcastilho/autonomous
  # Pinned tool versions — must match the Dockerfile's ARG defaults
  # (Dockerfile is the source of truth; restated here so CI provenance shows
  # exactly what was requested rather than relying on the build-arg default).
  GH_VERSION: "2.96.0"
  CLAUDE_CODE_VERSION: "stable"
  SPECKIT_VERSION: "v0.12.11"
  UV_VERSION: "0.11.32"
  MISE_VERSION: "v2026.7.13"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive and validate version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ github.event.inputs.version }}"
          else
            RAW="${GITHUB_REF#refs/tags/}"
          fi
          if ! echo "$RAW" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$RAW' is not a valid v<semver> version" >&2
            exit 1
          fi
          echo "version=$RAW" >> "$GITHUB_OUTPUT"
          echo "image_ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$RAW" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "short_sha=sha-$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Immutability guard (SC-010) — a published v<semver> tag is never
      # overwritten. Must run after login: GHCR resolves a private package
      # only when authenticated.
      - name: Immutability guard
        run: |
          if docker buildx imagetools inspect "${{ steps.version.outputs.image_ref }}" >/dev/null 2>&1; then
            echo "::error::${{ steps.version.outputs.image_ref }} already exists — version tags are immutable" >&2
            exit 1
          fi

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: local/autonomous:smoke
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
            BUILT_AT=${{ steps.version.outputs.built_at }}
            IMAGE_REF=${{ steps.version.outputs.image_ref }}
            GH_VERSION=${{ env.GH_VERSION }}
            CLAUDE_CODE_VERSION=${{ env.CLAUDE_CODE_VERSION }}
            SPECKIT_VERSION=${{ env.SPECKIT_VERSION }}
            UV_VERSION=${{ env.UV_VERSION }}
            MISE_VERSION=${{ env.MISE_VERSION }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      # SC-005 — no credential value baked into any layer.
      - name: Secret scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: local/autonomous:smoke
          scanners: secret
          exit-code: "1"

      # Starts the built image against a minimal, on-the-fly prepared target
      # repo (real TargetPack, real non-template constitution) using the same
      # launcher operators use, then asserts the preflight report exists and
      # /etc/autonomous/image.json reflects this build's args (contract §6
      # step 7).
      - name: Smoke test
        run: |
          set -euo pipefail

          SMOKE_REPO="$HOME/smoke-fixture-repo"
          mkdir -p "$SMOKE_REPO/.claude/hooks" "$SMOKE_REPO/.claude/skills" "$SMOKE_REPO/.specify/memory"
          git -C "$SMOKE_REPO" init -q
          cp -r priv/target_pack/.claude/. "$SMOKE_REPO/.claude/"
          cat > "$SMOKE_REPO/.specify/memory/constitution.md" <<'EOF'
          # Smoke Test Constitution

          Non-template constitution used only to satisfy `TargetPack.verify/1`
          for the image-publishing workflow's smoke test.
          EOF
          git -C "$SMOKE_REPO" add -A

          ENV_FILE="$RUNNER_TEMP/smoke.env"
          cat > "$ENV_FILE" <<EOF
          SPECKIT_REPO=$SMOKE_REPO
          ANTHROPIC_API_KEY=sk-ant-smoke-test-placeholder
          GIT_AUTHOR_NAME=CI Smoke
          GIT_AUTHOR_EMAIL=ci@example.com
          GIT_COMMITTER_NAME=CI Smoke
          GIT_COMMITTER_EMAIL=ci@example.com
          EOF

          scripts/autonomous-container.sh start \
            --env-file "$ENV_FILE" \
            --image local/autonomous:smoke \
            --name autonomous-smoke \
            --port 4000

          cleanup() { docker logs autonomous-smoke || true; docker rm -f autonomous-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          report=""
          for _ in $(seq 1 30); do
            if report="$(docker exec autonomous-smoke cat "$HOME/.autonomous/preflight/latest.json" 2>/dev/null)"; then
              break
            fi
            sleep 2
          done
          [ -n "$report" ] || { echo "::error::no preflight report produced within timeout" >&2; exit 1; }

          status="$(echo "$report" | jq -r '.status')"
          [ "$status" != "fail" ] || { echo "::error::preflight failed:"; echo "$report"; exit 1; }

          image_json="$(docker exec autonomous-smoke cat /etc/autonomous/image.json)"
          rev="$(echo "$image_json" | jq -r '.source_revision')"
          ref="$(echo "$image_json" | jq -r '.image_ref')"
          [ "$rev" = "${{ github.sha }}" ] || { echo "::error::image.json source_revision '$rev' != ${{ github.sha }}" >&2; exit 1; }
          [ "$ref" = "${{ steps.version.outputs.image_ref }}" ] || { echo "::error::image.json image_ref '$ref' != ${{ steps.version.outputs.image_ref }}" >&2; exit 1; }

      - name: Tag and push
        run: |
          docker tag local/autonomous:smoke "${{ steps.version.outputs.image_ref }}"
          docker tag local/autonomous:smoke "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.short_sha }}"
          docker tag local/autonomous:smoke "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          docker push "${{ steps.version.outputs.image_ref }}"
          docker push "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.short_sha }}"
          docker push "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

      - name: Record digest
        run: |
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "${{ steps.version.outputs.image_ref }}")"
          {
            echo "### Published ${{ steps.version.outputs.image_ref }}"
            echo ""
            echo "\`$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
